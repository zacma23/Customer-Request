version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zacma_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: crm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zacma_crm_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/crm_db?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-secret_jwt_access_token_super_long_32_characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-secret_jwt_refresh_token_super_long_32_characters}
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000,http://localhost:80
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: zacma_crm_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
  uploads_data:
